[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordloom-desktop"
version = "0.1.0"
description = "Local vocabulary notebook with configurable model providers"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "keyring>=25,<27"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.gui-scripts]
wordloom = "wordloom.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wordloom = ["resources/*.svg", "resources/*.ps1"]
